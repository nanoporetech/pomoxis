image: ${CI_REGISTRY}/traque/ont-docker-base/ont-base-python:3.12

include:
    - project: "epi2melabs/ci-templates"
      file:
          - "push-conda.yaml"
          - "push-github.yaml"
          - "snippets.yaml"

default:
    tags:
        - linux
        - small
        - standard
        - x86_64

stages:
    - test
    - build
    - release

.setup_ubuntu: &setup_ubuntu |
    export DEBIAN_FRONTEND=noninteractive
    apt-get update -qq
    apt-get install -y -qq build-essential curl git wget


test-all:
    stage: test
    before_script:
        - *setup_ubuntu
        - apt-get install -y -qq libbz2-dev libcurl4-gnutls-dev liblzma-dev libncurses5-dev libssl-dev zlib1g-dev  
    script:
        - make -j 4 install
        - make test

build:sdist:
    stage: build
    script:
        - make sdist
    artifacts:
        paths:
            - dist/*.tar.gz
            - dist/*.whl

deploy:pypi:
    stage: release
    script:
        - make venv_pypi/bin/activate
        - source venv_pypi/bin/activate
        - twine upload --non-interactive dist/pomoxis*
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/'


#########
# CONDA #
#########

# Tags are inherited from parent rule

conda:
    extends: .deploy-conda
    stage: build
    variables:
        UPLOAD: "no"
        USE_ORG_CHANNEL: "yes"
        CONDA_PKG: "${CI_PROJECT_NAME}"
        CONDA_PKG_VERSION: "dev"
        PACKAGE_ARCH: "noarch"
    rules:
        - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\S+)?$/
          when: never
        - if: $CI_PIPELINE_SOURCE == "push"

push-conda:
    extends: .deploy-conda
    variables:
        UPLOAD: "yes"
        USE_ORG_CHANNEL: "yes"
        CONDA_PKG: "${CI_PROJECT_NAME}"
        PACKAGE_ARCH: "noarch"
    before_script:
        # We need to strip off the "v" from the front of the tag
        # otherwise conda keeps it in the version string
        - export CONDA_PKG_VERSION=${CI_COMMIT_TAG/v/}
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\S+)?$/'

##########
# GITHUB #
##########

# Mirrors rule in ci-templates/push-github.yaml but replaces user details
# and authorisation to skip OTP and use existing token
.github:
    setup-gh-repo:
        - git config --global user.email "research.git@nanoporetech.com"
        - git config --global user.name "ontresearch"
        - gh auth setup-git --hostname github.com
        - gh auth status  # check auth status

# Send all tags matching vX.Y.Z to github (code and release)
push-github:
    variables:
        GH_NAMESPACE: "nanoporetech"
        GH_TOKEN: ${RESEARCH_BOT_GH_TOKEN}
        GITHUB_AUTH_SCOPES: ""
